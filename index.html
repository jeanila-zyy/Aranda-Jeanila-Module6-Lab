<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <h1>Student Registration Form</h1>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName">
                <div id="fullNameError" class="error"></div>
            </div>

            <div class="form-group">
                <label for="studentNumber">Student Number</label>
                <input type="text" id="studentNumber" name="studentNumber">
                <div id="studentNumberError" class="error"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">
                <div id="emailError" class="error"></div>
            </div>

            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="tel" id="mobileNumber" name="mobileNumber">
                <div id="mobileNumberError" class="error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
                <div id="passwordError" class="error"></div>
                <div id="passwordFeedback" class="feedback"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <div id="confirmPasswordError" class="error"></div>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value="" selected disabled>Select your course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                </select>
                <div id="courseError" class="error"></div>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the terms and conditions.</label>
                <div id="termsError" class="error"></div>
            </div>

            <div class="buttons">
                <button type="submit" id="registerBtn">Register</button>
                <button type="reset" id="resetBtn">Reset</button>
            </div>

        </form>

        <div id="successMessage" class="success"></div>

        <section id="registrationSummary" class="summary" hidden>
            <h2>Registration Summary</h2>

            <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
            <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
            <p><strong>Email Address:</strong> <span id="summaryEmail"></span></p>
            <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
            <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
